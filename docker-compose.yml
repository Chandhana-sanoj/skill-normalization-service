
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skill-normalization-backend
    ports:
      - "8004:8000"
    env_file:
      - .env
    environment:
      HF_HOME: /root/.cache/huggingface
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skill-normalization-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  huggingface_cache:
